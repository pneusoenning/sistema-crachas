<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cartão de Identificação</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8eaf6 0%, #c5cae9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ===== CARD PRINCIPAL ===== */
    .id-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.2);
    }

    /* ===== HEADER AZUL ===== */
    .card-header {
      background: linear-gradient(135deg, #1565C0 0%, #1976D2 50%, #42A5F5 100%);
      padding: 28px 24px 70px;
      text-align: center;
      position: relative;
    }

    .card-header-title {
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    /* Logo da empresa no header */
    .empresa-logo-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: white;
      opacity: 0.9;
    }

    .empresa-logo-header .logo-icon {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .empresa-logo-header .logo-text {
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* ===== FOTO CIRCULAR (sobreposta ao header) ===== */
    .foto-wrapper {
      position: absolute;
      bottom: -55px;
      left: 50%;
      transform: translateX(-50%);
    }

    .foto-circular {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 5px solid #ffffff;
      object-fit: cover;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      background: #e8eaf6;
    }

    .foto-placeholder-card {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 5px solid #ffffff;
      background: linear-gradient(135deg, #e8eaf6, #c5cae9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    /* ===== CORPO DO CARD ===== */
    .card-body {
      padding: 70px 24px 28px;
    }

    /* ===== CAMPOS DE INFORMAÇÃO ===== */
    .info-field {
      background: #f5f5f5;
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 12px;
    }

    .info-field .field-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .info-field .field-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    /* ===== SITUAÇÃO ===== */
    .situacao-field {
      background: #f5f5f5;
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 12px;
    }

    .situacao-field .field-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .situacao-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Badge ATIVO */
    .badge-ativo-card {
      background: #e8f5e9;
      color: #2e7d32;
      border: 2px solid #a5d6a7;
      border-radius: 20px;
      padding: 4px 16px;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Badge INATIVO */
    .badge-inativo-card {
      background: #ffebee;
      color: #c62828;
      border: 2px solid #ef9a9a;
      border-radius: 20px;
      padding: 4px 16px;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Identidade verificada */
    .verificado-text {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #2e7d32;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* ===== RODAPÉ DO CARD ===== */
    .card-footer {
      border-top: 1px solid #f0f0f0;
      padding: 16px 24px;
      text-align: center;
    }

    .card-footer p {
      font-size: 0.78rem;
      color: #aaa;
      font-weight: 500;
    }

    .card-footer p span {
      color: #888;
      font-weight: 600;
    }

    /* ===== LOADING / ERRO ===== */
    .status-box {
      text-align: center;
      padding: 60px 24px;
      color: #aaa;
    }

    .status-box .icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 12px;
    }

    /* ===== CARGO ===== */
    .cargo-badge {
      display: inline-block;
      background: #e8eaf6;
      color: #3949ab;
      border-radius: 8px;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-top: 4px;
    }

  </style>
</head>
<body>

  <div class="id-card" id="idCard">

    <!-- ESTADO DE CARREGAMENTO -->
    <div class="status-box" id="loading">
      <span class="icon">⏳</span>
      <p>Carregando dados...</p>
    </div>

    <!-- ESTADO DE ERRO -->
    <div class="status-box" id="erro" style="display:none;">
      <span class="icon">❌</span>
      <p style="color:#e53935; font-weight:600;">Funcionário não encontrado.</p>
      <p style="font-size:0.8rem; margin-top:8px;">
        Verifique se o QR Code é válido.
      </p>
    </div>

    <!-- CONTEÚDO DO CARTÃO -->
    <div id="conteudo" style="display:none;">

      <!-- HEADER COM GRADIENTE AZUL -->
      <div class="card-header">
        <div class="card-header-title">Cartão de Identificação</div>

        <div class="empresa-logo-header">
          <div class="logo-icon">🏢</div>
          <div class="logo-text" id="nomeEmpresa">Minha Empresa</div>
        </div>

        <!-- FOTO SOBREPOSTA -->
        <div class="foto-wrapper">
          <img
            id="cardFoto"
            class="foto-circular"
            src=""
            alt="Foto"
            style="display:none;"
          />
          <div class="foto-placeholder-card" id="cardFotoPlaceholder">👤</div>
        </div>
      </div>

      <!-- CORPO -->
      <div class="card-body">

        <!-- NOME COMPLETO -->
        <div class="info-field">
          <div class="field-label">Nome Completo</div>
          <div class="field-value" id="cardNome">—</div>
        </div>

        <!-- DOCUMENTO -->
        <div class="info-field">
          <div class="field-label">Documento Colaborador</div>
          <div class="field-value" id="cardDoc">—</div>
        </div>

        <!-- CARGO (se houver) -->
        <div class="info-field" id="cardCargoBox" style="display:none;">
          <div class="field-label">Cargo / Setor</div>
          <div class="field-value" id="cardCargo">—</div>
        </div>

        <!-- SITUAÇÃO -->
        <div class="situacao-field">
          <div class="field-label">Situação</div>
          <div class="situacao-row">
            <span id="cardBadge" class="badge-ativo-card">ATIVO</span>
            <span class="verificado-text" id="verificadoText">
              ✅ Identidade Verificada
            </span>
          </div>
        </div>

      </div>

      <!-- RODAPÉ -->
      <div class="card-footer">
        <p>✓ Cartão válido e verificado</p>
        <p style="margin-top:4px;">
          Gerado em <span id="cardData">—</span>
        </p>
      </div>

    </div>
  </div>

  <script src="js/db.js"></script>
  <script>
    // ================================================
    // Lê o ID da URL e monta o cartão do funcionário
    // ================================================
    const params = new URLSearchParams(window.location.search);
    const id     = params.get('id');

    const elLoading  = document.getElementById('loading');
    const elErro     = document.getElementById('erro');
    const elConteudo = document.getElementById('conteudo');

    function mostrarErro() {
      elLoading.style.display  = 'none';
      elErro.style.display     = 'block';
    }

    function formatarData(isoString) {
      if (!isoString) return '—';
      const d = new Date(isoString);
      return d.toLocaleDateString('pt-BR');
    }

    if (!id) {
      mostrarErro();
    } else {
      const func = DB.getById(id);

      if (!func) {
        mostrarErro();
      } else {

        // ----- FOTO -----
        if (func.foto) {
          const imgEl = document.getElementById('cardFoto');
          imgEl.src = func.foto;
          imgEl.style.display = 'block';
          document.getElementById('cardFotoPlaceholder').style.display = 'none';
        }

        // ----- NOME -----
        document.getElementById('cardNome').textContent = func.nome;

        // ----- DOCUMENTO -----
        document.getElementById('cardDoc').textContent = func.documento;

        // ----- CARGO -----
        if (func.cargo) {
          document.getElementById('cardCargo').textContent = func.cargo;
          document.getElementById('cardCargoBox').style.display = 'block';
        }

        // ----- SITUAÇÃO -----
        const badge = document.getElementById('cardBadge');
        const verificado = document.getElementById('verificadoText');

        if (func.situacao === 'Ativo') {
          badge.textContent  = 'ATIVO';
          badge.className    = 'badge-ativo-card';
          verificado.innerHTML = '✅ Identidade Verificada';
          verificado.style.color = '#2e7d32';
        } else {
          badge.textContent  = 'INATIVO';
          badge.className    = 'badge-inativo-card';
          verificado.innerHTML = '⚠️ Colaborador Inativo';
          verificado.style.color = '#c62828';
        }

        // ----- DATA -----
        document.getElementById('cardData').textContent =
          formatarData(func.criadoEm);

        // ----- EXIBE CONTEÚDO -----
        elLoading.style.display  = 'none';
        elConteudo.style.display = 'block';
      }
    }
  </script>

</body>
</html>
