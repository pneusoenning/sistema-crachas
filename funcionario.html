<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cartão de Identificação</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:'Inter',sans-serif;
      min-height:100vh;
      background:linear-gradient(135deg,#1565C0 0%,#1976D2 60%,#42A5F5 100%);
      display:flex;align-items:center;justify-content:center;padding:20px
    }

    .id-card{
      width:100%;max-width:390px;
      background:#fff;border-radius:24px;
      overflow:hidden;
      box-shadow:0 25px 60px rgba(0,0,0,0.3)
    }

    /* HEADER */
    .card-header{
      background:linear-gradient(135deg,#1565C0 0%,#1976D2 50%,#42A5F5 100%);
      padding:28px 24px 75px;
      text-align:center;position:relative
    }
    .card-header-title{
      color:rgba(255,255,255,0.85);
      font-size:0.8rem;font-weight:600;
      text-transform:uppercase;letter-spacing:2px;
      margin-bottom:10px
    }
    .empresa-nome{
      color:white;font-size:1.2rem;
      font-weight:800;text-transform:uppercase;letter-spacing:2px
    }

    /* FOTO SOBREPOSTA */
    .foto-wrapper{
      position:absolute;bottom:-55px;
      left:50%;transform:translateX(-50%)
    }
    .foto-circular{
      width:110px;height:110px;border-radius:50%;
      border:5px solid #fff;object-fit:cover;
      box-shadow:0 8px 25px rgba(0,0,0,0.2);
      background:#e8eaf6;display:block
    }
    .foto-placeholder-card{
      width:110px;height:110px;border-radius:50%;
      border:5px solid #fff;
      background:linear-gradient(135deg,#e8eaf6,#c5cae9);
      display:flex;align-items:center;justify-content:center;
      font-size:3rem;
      box-shadow:0 8px 25px rgba(0,0,0,0.2)
    }

    /* CORPO */
    .card-body{padding:70px 24px 24px}

    /* CAMPOS */
    .info-field{
      background:#f7f7f7;border-radius:12px;
      padding:13px 16px;margin-bottom:10px
    }
    .field-label{
      font-size:0.68rem;font-weight:700;color:#aaa;
      text-transform:uppercase;letter-spacing:1.5px;margin-bottom:3px
    }
    .field-value{
      font-size:1rem;font-weight:700;color:#1a1a1a
    }

    /* SITUAÇÃO */
    .situacao-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

    .badge-ativo-card{
      background:#e8f5e9;color:#2e7d32;
      border:2px solid #a5d6a7;border-radius:20px;
      padding:4px 16px;font-size:0.82rem;
      font-weight:800;text-transform:uppercase;letter-spacing:1px
    }
    .badge-inativo-card{
      background:#ffebee;color:#c62828;
      border:2px solid #ef9a9a;border-radius:20px;
      padding:4px 16px;font-size:0.82rem;
      font-weight:800;text-transform:uppercase;letter-spacing:1px
    }

    .verificado-text{
      display:flex;align-items:center;gap:5px;
      font-size:0.82rem;font-weight:600
    }

    /* RODAPÉ */
    .card-footer{
      border-top:1px solid #f0f0f0;
      padding:14px 24px;text-align:center
    }
    .card-footer p{font-size:0.75rem;color:#bbb;font-weight:500}

    /* STATUS */
    .status-box{text-align:center;padding:60px 24px;color:#aaa}
    .status-box .icon{font-size:3rem;display:block;margin-bottom:12px}
  </style>
</head>
<body>

<div class="id-card">

  <!-- CARREGANDO -->
  <div class="status-box" id="loading">
    <span class="icon">⏳</span>
    <p>Carregando dados...</p>
  </div>

  <!-- ERRO -->
  <div class="status-box" id="erro" style="display:none">
    <span class="icon">❌</span>
    <p style="color:#e53935;font-weight:600">Funcionário não encontrado.</p>
    <p style="font-size:0.8rem;margin-top:8px">Verifique se o QR Code é válido.</p>
  </div>

  <!-- CONTEÚDO -->
  <div id="conteudo" style="display:none">

    <div class="card-header">
      <div class="card-header-title">Cartão de Identificação</div>
      <div class="empresa-nome">🏢 Minha Empresa</div>

      <div class="foto-wrapper">
        <img id="cardFoto" class="foto-circular" src="" alt="Foto" style="display:none"/>
        <div class="foto-placeholder-card" id="cardFotoPlaceholder">👤</div>
      </div>
    </div>

    <div class="card-body">

      <!-- NOME -->
      <div class="info-field">
        <div class="field-label">Nome Completo</div>
        <div class="field-value" id="cardNome">—</div>
      </div>

      <!-- DOCUMENTO -->
      <div class="info-field">
        <div class="field-label">Documento Colaborador</div>
        <div class="field-value" id="cardDoc">—</div>
      </div>

      <!-- CARGO -->
      <div class="info-field" id="cardCargoBox" style="display:none">
        <div class="field-label">Cargo / Setor</div>
        <div class="field-value" id="cardCargo">—</div>
      </div>

      <!-- SITUAÇÃO -->
      <div class="info-field">
        <div class="field-label">Situação</div>
        <div class="situacao-row">
          <span id="cardBadge" class="badge-ativo-card">ATIVO</span>
          <span class="verificado-text" id="verificadoText" style="color:#2e7d32">
            ✅ Identidade Verificada
          </span>
        </div>
      </div>

    </div>

    <div class="card-footer">
      <p>✓ Cartão válido e verificado</p>
      <p style="margin-top:3px">Cadastrado em <span id="cardData">—</span></p>
    </div>

  </div>
</div>

<script>
  // ════════════════════════════════════════
  // Lê os dados direto da URL do QR Code
  // Funciona em qualquer celular! ✅
  // ════════════════════════════════════════
  const params   = new URLSearchParams(window.location.search);
  const nome     = params.get('nome');
  const documento= params.get('documento');
  const situacao = params.get('situacao');
  const cargo    = params.get('cargo');
  const criado   = params.get('criado');
  const foto     = params.get('foto');

  const elLoading  = document.getElementById('loading');
  const elErro     = document.getElementById('erro');
  const elConteudo = document.getElementById('conteudo');

  // Se não tem nome, é inválido
  if(!nome || !documento){
    elLoading.style.display = 'none';
    elErro.style.display    = 'block';
  } else {

    // FOTO
    if(foto && foto.length > 10){
      const img = document.getElementById('cardFoto');
      img.src = foto;
      img.style.display = 'block';
      document.getElementById('cardFotoPlaceholder').style.display = 'none';
    }

    // NOME
    document.getElementById('cardNome').textContent = nome;

    // DOCUMENTO
    document.getElementById('cardDoc').textContent = documento;

    // CARGO
    if(cargo){
      document.getElementById('cardCargo').textContent = cargo;
      document.getElementById('cardCargoBox').style.display = 'block';
    }

    // SITUAÇÃO
    const badge      = document.getElementById('cardBadge');
    const verificado = document.getElementById('verificadoText');
    if(situacao === 'Ativo'){
      badge.textContent      = 'ATIVO';
      badge.className        = 'badge-ativo-card';
      verificado.innerHTML   = '✅ Identidade Verificada';
      verificado.style.color = '#2e7d32';
    } else {
      badge.textContent      = 'INATIVO';
      badge.className        = 'badge-inativo-card';
      verificado.innerHTML   = '⚠️ Colaborador Inativo';
      verificado.style.color = '#c62828';
    }

    // DATA
    if(criado){
      const d = new Date(criado);
      document.getElementById('cardData').textContent =
        d.toLocaleDateString('pt-BR');
    }

    elLoading.style.display  = 'none';
    elConteudo.style.display = 'block';
  }
</script>

</body>
</html>
