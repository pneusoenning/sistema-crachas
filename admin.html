<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin | Sistema de Crachás</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#333}
    :root{
      --primary:#1a237e;
      --success:#43a047;
      --danger:#e53935;
      --shadow:0 4px 20px rgba(0,0,0,0.1)
    }
    .navbar{
      background:var(--primary);color:white;
      padding:15px 30px;display:flex;
      align-items:center;justify-content:space-between;
      box-shadow:var(--shadow)
    }
    .navbar .logo{font-size:1.3rem;font-weight:800;letter-spacing:1px}
    .navbar .logo span{color:#ff5252}
    .container{max-width:1200px;margin:30px auto;padding:0 20px}
    .list-header{
      display:flex;justify-content:space-between;
      align-items:center;flex-wrap:wrap;
      gap:10px;margin-bottom:24px
    }
    .list-header h1{font-size:1.5rem;color:var(--primary)}
    .busca-input{
      padding:10px 16px;border:2px solid #e0e0e0;
      border-radius:8px;font-size:0.9rem;width:250px;
      font-family:'Inter',sans-serif
    }
    .busca-input:focus{outline:none;border-color:var(--primary)}
    .btn{
      padding:9px 18px;border:none;border-radius:8px;
      cursor:pointer;font-size:0.83rem;font-weight:700;
      transition:opacity 0.2s;font-family:'Inter',sans-serif
    }
    .btn:hover{opacity:0.85}
    .btn-primary{background:var(--primary);color:white}
    .btn-danger{background:var(--danger);color:white}
    .btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}
    .cards-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:20px
    }
    .card-funcionario{
      background:white;border-radius:16px;padding:24px;
      box-shadow:var(--shadow);display:flex;flex-direction:column;
      align-items:center;gap:10px;transition:transform 0.2s
    }
    .card-funcionario:hover{transform:translateY(-4px)}
    .foto-circulo{
      width:80px;height:80px;border-radius:50%;
      object-fit:cover;border:3px solid var(--primary)
    }
    .foto-placeholder{
      width:80px;height:80px;border-radius:50%;
      background:#e8eaf6;display:flex;align-items:center;
      justify-content:center;font-size:2rem;
      border:3px solid var(--primary)
    }
    .card-nome{font-size:1rem;font-weight:700;color:var(--primary);text-align:center}
    .card-doc{font-size:0.82rem;color:#666}
    .badge{
      padding:4px 14px;border-radius:20px;font-size:0.75rem;
      font-weight:700;text-transform:uppercase;letter-spacing:0.5px
    }
    .badge-ativo{background:#e8f5e9;color:var(--success);border:1px solid var(--success)}
    .badge-inativo{background:#ffebee;color:var(--danger);border:1px solid var(--danger)}
    .card-acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
    .empty-state{text-align:center;padding:60px 20px;color:#aaa;grid-column:1/-1}
    .empty-state .icon{font-size:4rem;display:block;margin-bottom:10px}
    .modal-overlay{
      display:none;position:fixed;inset:0;
      background:rgba(0,0,0,0.55);z-index:1000;
      justify-content:center;align-items:center
    }
    .modal-overlay.ativo{display:flex}
    .modal{
      background:white;border-radius:16px;padding:32px;
      width:90%;max-width:460px;
      box-shadow:0 20px 60px rgba(0,0,0,0.3);
      max-height:90vh;overflow-y:auto
    }
    .modal h2{color:var(--primary);margin-bottom:20px;font-size:1.2rem}
    .form-group{margin-bottom:14px}
    .form-group label{
      display:block;font-size:0.82rem;font-weight:600;
      color:#555;margin-bottom:5px
    }
    .form-group input,
    .form-group select{
      width:100%;padding:10px 13px;border:2px solid #e0e0e0;
      border-radius:8px;font-size:0.9rem;
      font-family:'Inter',sans-serif;transition:border-color 0.2s
    }
    .form-group input:focus,
    .form-group select:focus{outline:none;border-color:var(--primary)}
    .modal-acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
    #fotoPreview{
      width:80px;height:80px;border-radius:50%;
      background:#e8eaf6;display:flex;align-items:center;
      justify-content:center;font-size:2rem;
      border:3px solid var(--primary);
      margin:0 auto 16px;overflow:hidden
    }
    .qr-container{text-align:center;padding:10px}
    .qr-label{margin-top:8px;font-size:0.78rem;color:#999}
    .alerta-qr{
      background:#e8f5e9;border:1px solid #a5d6a7;
      border-radius:10px;padding:10px 14px;
      font-size:0.8rem;color:#2e7d32;
      margin-bottom:14px;text-align:center
    }
    .toast{
      position:fixed;bottom:30px;right:30px;
      background:#323232;color:white;
      padding:12px 24px;border-radius:10px;
      font-size:0.88rem;font-weight:600;
      opacity:0;transition:opacity 0.3s;
      z-index:9999;pointer-events:none
    }
    .toast.show{opacity:1}

    /* CONFIG PANEL */
    .config-bar{
      background:#fff3e0;border:1px solid #ffcc02;
      border-radius:10px;padding:12px 16px;
      margin-bottom:20px;font-size:0.85rem;
      display:flex;align-items:center;gap:10px;
      flex-wrap:wrap
    }
    .config-bar input{
      flex:1;min-width:200px;padding:6px 10px;
      border:1px solid #ccc;border-radius:6px;
      font-family:'Inter',sans-serif;font-size:0.82rem
    }
    .config-bar .btn{padding:6px 14px;font-size:0.8rem}
  </style>
</head>
<body>

<nav class="navbar">
  <div class="logo">CRACHÁ<span>DIGITAL</span></div>
  <span style="font-size:0.82rem;opacity:0.8">Painel Administrativo</span>
</nav>

<div class="container">

  <!-- BARRA DE CONFIGURAÇÃO DO JSONBIN -->
  <div class="config-bar" id="configBar">
    ⚙️ <strong>Configure o JSONBin:</strong>
    <input type="text" id="inputApiKey"
      placeholder="Cole sua API Key aqui: $2b$10$..."
      oninput="salvarConfig()"/>
    <input type="text" id="inputBinId"
      placeholder="Bin ID (gerado automaticamente)"
      readonly style="background:#f5f5f5;color:#888"/>
    <button class="btn btn-primary" onclick="inicializarBin()">
      🚀 Inicializar Banco
    </button>
  </div>

  <div class="list-header">
    <h1>👥 Funcionários</h1>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input type="text" id="busca" class="busca-input"
        placeholder="🔍 Buscar funcionário..."
        oninput="filtrarFuncionarios()"/>
      <button class="btn btn-primary" onclick="abrirModal()">
        + Novo Funcionário
      </button>
    </div>
  </div>

  <div class="cards-grid" id="listaFuncionarios"></div>
</div>

<div class="toast" id="toast"></div>

<!-- MODAL CADASTRO -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitulo">➕ Novo Funcionário</h2>
    <div id="fotoPreview">👤</div>
    <form id="formFuncionario" onsubmit="salvarFuncionario(event)">
      <div class="form-group">
        <label>📸 Foto do Funcionário</label>
        <input type="file" id="inputFoto" accept="image/*" onchange="previewFoto(event)"/>
      </div>
      <div class="form-group">
        <label>👤 Nome Completo *</label>
        <input type="text" id="inputNome" placeholder="Ex: João da Silva" required/>
      </div>
      <div class="form-group">
        <label>🪪 Documento do Colaborador *</label>
        <input type="text" id="inputDoc" placeholder="Ex: 123.456.789-00" required/>
      </div>
      <div class="form-group">
        <label>📌 Situação *</label>
        <select id="inputSituacao" required>
          <option value="Ativo">✅ Ativo</option>
          <option value="Inativo">❌ Inativo</option>
        </select>
      </div>
      <div class="form-group">
        <label>🏢 Cargo / Setor</label>
        <input type="text" id="inputCargo" placeholder="Ex: Analista de TI"/>
      </div>
      <div class="modal-acoes">
        <button type="button" class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnSalvar">💾 Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL QR CODE -->
<div class="modal-overlay" id="modalQR">
  <div class="modal" style="max-width:380px;text-align:center">
    <h2>📱 QR Code</h2>
    <p id="qrNomeFuncionario"
       style="color:#666;margin-bottom:10px;font-size:0.9rem;font-weight:600"></p>
    <div class="alerta-qr">
      ✅ Situação atualizada em tempo real!
    </div>
    <div class="qr-container">
      <div id="qrCodeDiv"></div>
      <p class="qr-label">Escaneie para ver os dados</p>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center">
      <button class="btn btn-primary" onclick="baixarQR()">⬇️ Baixar</button>
      <button class="btn btn-outline" onclick="fecharQR()">Fechar</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ════════════════════════════════
   CONFIGURAÇÕES DO JSONBIN
════════════════════════════════ */
const JSONBIN_URL = 'https://api.jsonbin.io/v3/b';

// Carrega config salva
let API_KEY = localStorage.getItem('jb_apikey') || '';
let BIN_ID  = localStorage.getItem('jb_binid')  || '';

// Preenche inputs de config
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('inputApiKey').value = API_KEY;
  document.getElementById('inputBinId').value  = BIN_ID;

  // Esconde barra de config se já configurado
  if (API_KEY && BIN_ID) {
    document.getElementById('configBar').style.display = 'none';
  }

  carregarFuncionarios();
});

function salvarConfig() {
  API_KEY = document.getElementById('inputApiKey').value.trim();
  localStorage.setItem('jb_apikey', API_KEY);
}

/* ════════════════════════════════
   INICIALIZAR BIN (primeira vez)
════════════════════════════════ */
async function inicializarBin() {
  if (!API_KEY) {
    alert('Cole sua API Key primeiro!');
    return;
  }

  showToast('⏳ Criando banco de dados...');

  try {
    const res = await fetch(JSONBIN_URL, {
      method: 'POST',
      headers: {
        'Content-Type':    'application/json',
        'X-Master-Key':    API_KEY,
        'X-Bin-Name':      'sistema-crachas',
        'X-Bin-Private':   'false'
      },
      body: JSON.stringify({ funcionarios: [] })
    });

    if (!res.ok) throw new Error('Erro ao criar bin: ' + res.status);

    const data = await res.json();
    BIN_ID = data.metadata.id;
    localStorage.setItem('jb_binid', BIN_ID);
    document.getElementById('inputBinId').value = BIN_ID;

    showToast('✅ Banco criado com sucesso!');

    // Esconde barra de config
    setTimeout(() => {
      document.getElementById('configBar').style.display = 'none';
    }, 2000);

  } catch(e) {
    alert('Erro: ' + e.message + '\n\nVerifique sua API Key!');
  }
}

/* ════════════════════════════════
   CARREGAR FUNCIONÁRIOS DO JSONBIN
════════════════════════════════ */
async function carregarFuncionarios() {
  if (!BIN_ID || !API_KEY) {
    renderizarFuncionarios([]);
    return;
  }

  try {
    const res = await fetch(`${JSONBIN_URL}/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    const data = await res.json();
    const lista = data.record.funcionarios || [];
    renderizarFuncionarios(lista);
  } catch(e) {
    console.error('Erro ao carregar:', e);
    renderizarFuncionarios([]);
  }
}

/* ════════════════════════════════
   SALVAR LISTA NO JSONBIN
════════════════════════════════ */
async function salvarNoBin(lista) {
  if (!BIN_ID || !API_KEY) {
    alert('Configure o JSONBin primeiro!');
    return false;
  }

  const res = await fetch(`${JSONBIN_URL}/${BIN_ID}`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': API_KEY
    },
    body: JSON.stringify({ funcionarios: lista })
  });

  if (!res.ok) throw new Error('Erro ao salvar: ' + res.status);
  return true;
}

/* ════════════════════════════════
   VARIÁVEIS GLOBAIS
════════════════════════════════ */
let editandoId    = null;
let fotoBase64    = null;
let listaAtual    = [];  // cache local

/* ════════════════════════════════
   TOAST
════════════════════════════════ */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

/* ════════════════════════════════
   RENDERIZAR CARDS
════════════════════════════════ */
function renderizarFuncionarios(lista) {
  listaAtual = lista;
  const container = document.getElementById('listaFuncionarios');
  container.innerHTML = '';

  if (!lista || lista.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <span class="icon">👥</span>
        <p style="font-size:1rem;font-weight:600">
          Nenhum funcionário cadastrado ainda.
        </p>
        <p style="margin-top:6px;font-size:0.85rem">
          Clique em <strong>"+ Novo Funcionário"</strong> para começar!
        </p>
      </div>`;
    return;
  }

  lista.forEach(func => {
    const foto = func.foto
      ? `<img src="${func.foto}" class="foto-circulo" alt="Foto"/>`
      : `<div class="foto-placeholder">👤</div>`;

    const badgeCls  = func.situacao === 'Ativo' ? 'badge-ativo'  : 'badge-inativo';
    const badgeIcon = func.situacao === 'Ativo' ? '✅' : '❌';

    container.innerHTML += `
      <div class="card-funcionario">
        ${foto}
        <div class="card-nome">${func.nome}</div>
        <div class="card-doc">🪪 ${func.documento}</div>
        ${func.cargo ? `<div class="card-doc">💼 ${func.cargo}</div>` : ''}
        <span class="badge ${badgeCls}">${badgeIcon} ${func.situacao}</span>
        <div class="card-acoes">
          <button class="btn btn-primary"
            onclick="verQR('${func.id}')">📱 QR</button>
          <button class="btn btn-outline"
            onclick="editarFuncionario('${func.id}')">✏️ Editar</button>
          <button class="btn btn-danger"
            onclick="excluirFuncionario('${func.id}')">🗑️</button>
        </div>
      </div>`;
  });
}

/* ════════════════════════════════
   BUSCA
════════════════════════════════ */
function filtrarFuncionarios() {
  const t = document.getElementById('busca').value.toLowerCase();
  const filtrados = listaAtual.filter(f =>
    f.nome.toLowerCase().includes(t) ||
    f.documento.toLowerCase().includes(t) ||
    (f.cargo && f.cargo.toLowerCase().includes(t))
  );
  renderizarFuncionarios(filtrados);
}

/* ════════════════════════════════
   MODAL
════════════════════════════════ */
function abrirModal() {
  editandoId = null;
  fotoBase64 = null;
  document.getElementById('inputNome').value     = '';
  document.getElementById('inputDoc').value      = '';
  document.getElementById('inputSituacao').value = 'Ativo';
  document.getElementById('inputCargo').value    = '';
  document.getElementById('inputFoto').value     = '';
  document.getElementById('fotoPreview').innerHTML = '👤';
  document.getElementById('modalTitulo').textContent = '➕ Novo Funcionário';
  document.getElementById('modalOverlay').classList.add('ativo');
}

function fecharModal() {
  document.getElementById('modalOverlay').classList.remove('ativo');
}

/* ════════════════════════════════
   EDITAR
════════════════════════════════ */
function editarFuncionario(id) {
  const func = listaAtual.find(f => f.id === id);
  if (!func) return;

  editandoId = id;
  fotoBase64 = func.foto || null;
  document.getElementById('inputNome').value     = func.nome;
  document.getElementById('inputDoc').value      = func.documento;
  document.getElementById('inputSituacao').value = func.situacao;
  document.getElementById('inputCargo').value    = func.cargo || '';
  document.getElementById('fotoPreview').innerHTML = func.foto
    ? `<img src="${func.foto}"
         style="width:80px;height:80px;object-fit:cover;border-radius:50%"/>`
    : '👤';
  document.getElementById('modalTitulo').textContent = '✏️ Editar Funcionário';
  document.getElementById('modalOverlay').classList.add('ativo');
}

/* ════════════════════════════════
   PREVIEW FOTO
════════════════════════════════ */
function previewFoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 150;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = h*(MAX/w); w = MAX; } }
      else        { if (h > MAX) { w = w*(MAX/h); h = MAX; } }
      canvas.width  = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      fotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
      document.getElementById('fotoPreview').innerHTML =
        `<img src="${fotoBase64}"
           style="width:80px;height:80px;object-fit:cover;border-radius:50%"/>`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ════════════════════════════════
   SALVAR FUNCIONÁRIO
════════════════════════════════ */
async function salvarFuncionario(event) {
  event.preventDefault();

  const btnSalvar = document.getElementById('btnSalvar');
  btnSalvar.textContent = '⏳ Salvando...';
  btnSalvar.disabled = true;

  const dados = {
    nome:      document.getElementById('inputNome').value.trim(),
    documento: document.getElementById('inputDoc').value.trim(),
    situacao:  document.getElementById('inputSituacao').value,
    cargo:     document.getElementById('inputCargo').value.trim(),
    foto:      fotoBase64 || null
  };

  try {
    // Busca lista atual do JSONBin
    const res = await fetch(`${JSONBIN_URL}/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    const data = await res.json();
    let lista = data.record.funcionarios || [];

    if (editandoId) {
      // Atualiza mantendo o ID original
      lista = lista.map(f =>
        f.id === editandoId ? { ...f, ...dados } : f
      );
      showToast('✅ Funcionário atualizado!');
    } else {
      // Cria novo com ID único
      dados.id       = 'func_' + Date.now();
      dados.criadoEm = new Date().toISOString();
      lista.push(dados);
      showToast('✅ Funcionário cadastrado!');
    }

    await salvarNoBin(lista);
    fecharModal();
    renderizarFuncionarios(lista);

  } catch(e) {
    alert('Erro ao salvar: ' + e.message);
  } finally {
    btnSalvar.textContent = '💾 Salvar';
    btnSalvar.disabled = false;
  }
}

/* ════════════════════════════════
   EXCLUIR
════════════════════════════════ */
async function excluirFuncionario(id) {
  const func = listaAtual.find(f => f.id === id);
  if (!func) return;
  if (!confirm(`Deseja excluir "${func.nome}"?`)) return;

  try {
    const res = await fetch(`${JSONBIN_URL}/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    const data = await res.json();
    const lista = (data.record.funcionarios || []).filter(f => f.id !== id);
    await salvarNoBin(lista);
    showToast('🗑️ Funcionário removido!');
    renderizarFuncionarios(lista);
  } catch(e) {
    alert('Erro ao excluir: ' + e.message);
  }
}

/* ════════════════════════════════
   QR CODE — aponta só para o ID!
   Situação é lida em tempo real! ✅
════════════════════════════════ */
function verQR(id) {
  const func = listaAtual.find(f => f.id === id);
  if (!func) return;

  // URL com ID + BinID (para o celular buscar os dados)
  const base = 'https://pneusoenning.github.io/sistema-crachas/funcionario.html';
  const url  = `${base}?id=${func.id}&bin=${BIN_ID}&key=${API_KEY}`;

  document.getElementById('qrNomeFuncionario').textContent = func.nome;
  document.getElementById('qrCodeDiv').innerHTML = '';

  setTimeout(() => {
    new QRCode(document.getElementById('qrCodeDiv'), {
      text:         url,
      width:        220,
      height:       220,
      colorDark:    '#1a237e',
      colorLight:   '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  }, 100);

  document.getElementById('modalQR').classList.add('ativo');
}

function fecharQR() {
  document.getElementById('modalQR').classList.remove('ativo');
  document.getElementById('qrCodeDiv').innerHTML = '';
}

function baixarQR() {
  setTimeout(() => {
    const canvas = document.querySelector('#qrCodeDiv canvas');
    if (!canvas) return;
    const link    = document.createElement('a');
    link.download = 'qrcode-funcionario.png';
    link.href     = canvas.toDataURL('image/png');
    link.click();
  }, 300);
}
</script>
</body>
</html>
